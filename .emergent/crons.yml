crons:
  - name: session-reminders
    description: "Live-session reminders, consultation review requests, and wishlist sale-ending / price-drop emails"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/session-reminders"
    method: POST
    enabled: true
  - name: streak-rescue
    description: "Evening email to students whose daily-drill streak will break if they skip today's drill"
    cron: "0 19 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/streak-rescue"
    method: POST
    enabled: true
  - name: course-sync
    description: "Refreshes self-paced course prices and new courses from socprofessionals.com every morning"
    cron: "0 6 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/course-sync"
    method: POST
    enabled: true
  - name: blog-sync
    description: "Pulls new stories from The Hacker News and BleepingComputer and writes SOC summaries each morning"
    cron: "0 7 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/blog-sync"
    method: POST
    enabled: true
  - name: weekly-digest
    description: "Monday 9am IST: weekly threat digest plus each student's next SOC Analyst Series post"
    cron: "0 9 * * 1"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    enabled: true
